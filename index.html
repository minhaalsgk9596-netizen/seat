<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자동 좌석배치 — 코드 배포</title>
<style>
  body{margin:0;font-family:"Malgun Gothic","맑은 고딕",sans-serif;background:#f4f6fb;color:#1f2933;
       display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:28px 32px;max-width:520px}
  h1{font-size:19px;color:#1f3864;margin:0 0 14px}
  p{font-size:14px;line-height:1.7;color:#475569;margin:0 0 10px}
  b{color:#1f3864}
  .v{margin-top:18px;padding:10px 14px;background:#eef4fc;border:1px solid #d6e4f5;border-radius:9px;
     font-size:13px;color:#1f3864}
</style>
</head>
<body>
<div class="card">
  <h1>자동 좌석배치 (원곡고Ver) — 코드 배포 서버</h1>
  <p>이 주소는 <b>프로그램 코드만</b> 보관하는 곳입니다. 선생님들께 전달된 좌석배치 파일이
     열릴 때 여기서 최신 코드를 받아가 스스로 업데이트합니다.</p>
  <p><b>학생 명단·시험 시간표 등 개인정보는 이곳에 올라가지 않습니다.</b>
     해당 자료는 업무포털로 전달된 파일 안에만 들어 있습니다.</p>
  <div class="v" id="v">현재 버전을 확인하는 중…</div>
</div>
<script>
fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
  document.getElementById("v").innerHTML="최신 버전 <b>"+j.v+"</b> · "+(j.note||"")+"<br>배포 시각 "+(j.at||"");
}).catch(function(){ document.getElementById("v").textContent="버전 정보를 불러오지 못했습니다."; });
</script>
</body>
</html>
